<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100d15"><link rel="manifest" href="manifest.json"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>Lixr — See it. Clone it. Mix it.</title><style>*{box-sizing:border-box}body{margin:0;background:#100d15;color:#faf7ff;font:15px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:20px 18px 100px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.logo{font-size:38px;font-weight:800;letter-spacing:-3px}.logo b{color:#dc4dff}small,.muted{color:#b5a9c1}h1{font-size:32px;line-height:1.05;margin:0 0 12px}h2{font-size:21px;margin:24px 0 14px}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit;background:#25202e;border:1px solid #393044;border-radius:14px;padding:13px}button.primary{background:linear-gradient(100deg,#8b19d8,#d622ee);border:0;font-weight:700}button.active{color:#e767ff;border-color:#b737e8}input,textarea,select{width:100%;background:#211b2a;color:white;border:1px solid #44364f;border-radius:12px;padding:13px;margin:8px 0}textarea{min-height:100px} .hero{min-height:230px;border-radius:22px;padding:24px;background:linear-gradient(90deg,#160c22 0%,#160c22cc 48%,transparent),url('hero.jpg') center right/cover;display:flex;align-items:center}.hero div{max-width:58%}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.tile{min-height:95px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.tile span{font-size:28px;color:#e45bff}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{overflow:hidden;border:1px solid #393044;border-radius:17px;background:#211b2a;text-align:left;padding:0}.card img{width:100%;height:140px;object-fit:cover}.card div{padding:12px}.panel{background:#211b2a;border:1px solid #393044;border-radius:18px;padding:18px;margin:12px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}nav{position:fixed;bottom:0;left:0;right:0;background:#15111c;border-top:1px solid #393044;display:flex;justify-content:center;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:5}nav button{border:0;background:none;flex:1;max-width:150px;font-size:12px;padding:6px}nav span{display:block;font-size:23px;margin-bottom:4px}.recipeimg{width:100%;max-height:300px;object-fit:cover;border-radius:18px}label.check{display:flex;align-items:center;gap:10px;padding:8px 0}label.check input{width:auto;margin:0;accent-color:#c63cf2}#preview{max-width:100%;max-height:240px;border-radius:12px}a{color:#e56cff} @media(max-width:360px){.grid{grid-template-columns:repeat(2,1fr)}.hero div{max-width:75%}}</style><body><main><header><div><div class="logo" role="img" aria-label="Lixr">Li<svg viewBox="0 0 48 62" aria-hidden="true" style="width:.8em;height:1.04em;margin:0 1px .02em;vertical-align:-.04em;filter:drop-shadow(0 0 6px rgba(220,77,255,.6))"><path d="M7 10L24 34L41 10Z" fill="#dc4dff" opacity=".35"/><path d="M4 8h40" stroke="#dc4dff" stroke-width="6" stroke-linecap="round"/><path d="M7 10L41 58M41 10L7 58" stroke="#dc4dff" stroke-width="7" stroke-linecap="round"/><circle cx="37" cy="3" r="3" fill="#dc4dff"/></svg>r</div><small>See it · Clone it · Mix it</small></div><button id="install">Install app</button></header><div id="app"></div></main><nav id="nav"></nav><script src="drinks.js"></script><script>
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const recipes=[{id:'blue',name:'Blue Hawaiian',type:'Cocktail',img:'blue.jpg',desc:'Tropical pineapple and coconut with a citrus finish.',ingredients:[[1.5,'oz','white rum'],[.75,'oz','blue curaçao'],[2,'oz','pineapple juice'],[1,'oz','coconut cream']],steps:['Add ingredients to a shaker with ice.','Shake until chilled.','Strain over fresh ice and garnish with pineapple.']},{id:'berry',name:'Strawberry Lime Fizz',type:'Mocktail',img:'berry.jpg',desc:'Bright berries, fresh lime and sparkling water.',ingredients:[[4,'','strawberries'],[1,'oz','lime juice'],[.5,'oz','simple syrup'],[4,'oz','sparkling water']],steps:['Muddle strawberries with lime and syrup.','Add ice and sparkling water.','Stir gently and garnish.']},{id:'choc',name:'Chocolate Cream Cooler',type:'Coffee & more',img:'choc.jpg',desc:'A rich chocolate dessert drink.',ingredients:[[6,'oz','milk'],[2,'tbsp','chocolate syrup'],[1,'oz','cream']],steps:['Blend milk and chocolate syrup with ice.','Pour into a glass.','Top with cream.']},{id:'mojito',name:'Mojito',type:'Cocktail',img:'hero.jpg',desc:'Refreshing mint and lime.',ingredients:[[2,'oz','white rum'],[1,'oz','lime juice'],[.75,'oz','simple syrup'],[6,'','mint leaves'],[2,'oz','sparkling water']],steps:['Gently muddle mint with syrup and lime.','Add rum and ice.','Top with sparkling water and stir.']}];
(window.LIXR_DRINKS||[]).forEach(d=>{if(!recipes.some(r=>r.name.toLowerCase()===d.name.toLowerCase()))recipes.push(d)});
let saved=JSON.parse(localStorage.lixrSaved||'[]'),bar=JSON.parse(localStorage.lixrBar||'[]'),custom=JSON.parse(localStorage.lixrCustom||'[]'),page='Home',mode='Describe',filter='All',current=null,serves=1;const all=()=>[...recipes,...custom];const persist=()=>{localStorage.lixrSaved=JSON.stringify(saved);localStorage.lixrBar=JSON.stringify(bar);localStorage.lixrCustom=JSON.stringify(custom)};const card=r=>`<button class="card" onclick="detail('${r.id}')"><img src="${esc(r.img||'hero.jpg')}" alt="" loading="lazy" decoding="async"><div><strong>${esc(r.name)}</strong><br><small>${esc(r.type)}</small></div></button>`;const tile=(icon,label,action)=>`<button class="tile" onclick="${action}"><span>${icon}</span>${label}</button>`;
function go(p){page=p;render();window.scrollTo(0,0)}function clone(m){mode=m;go('Clone')}function render(){ $('#nav').innerHTML=['Home','Clone','Recipes','Discover','My Bar'].map((p,i)=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><span>${['⌂','◎','♧','◈','▤'][i]}</span>${p}</button>`).join('');let h='';if(page==='Home')h=`<section class="hero"><div><h1>Clone any drink.</h1><p>From the menu to your glass.</p><button class="primary" onclick="clone('Describe')">Clone a drink →</button></div></section><div class="grid">${tile('▣','Scan Menu',"clone('Scan')")}${tile('▧','Photo Clone',"clone('Photo')")}${tile('⌨','Describe It',"clone('Describe')")}${tile('♧','My Recipes',"go('Recipes')")}${tile('♡','Favorites',"go('Recipes')")}${tile('▤','My Bar',"go('My Bar')")}</div><h2>Discover drinks</h2><div class="cards">${recipes.slice(0,8).map(card).join('')}</div>`;
if(page==='Clone')h=`<h1>Scan & clone</h1><div class="row">${['Scan','Photo','Describe'].map(m=>`<button class="${mode===m?'active':''}" onclick="clone('${m}')">${m}</button>`).join('')}</div><div class="panel">${mode!=='Describe'?`<label>Capture or upload ${mode==='Scan'?'a menu':'a drink'}<input type="file" accept="image/*" capture="environment" onchange="preview(this)"></label><img id="preview"><p class="muted">Lixr’s AI reads your photo. Add a note below if you like.</p>`:''}<label>Drink name or description<textarea id="desc" placeholder="e.g. pineapple, coconut, blue curaçao"></textarea></label><button class="primary" onclick="match()">Find recipe matches</button><p class="muted">AI clones are best guesses. Works offline with local recipes.</p><div id="matches"></div></div><button onclick="editor()">Create a recipe manually</button>`;
if(page==='Recipes')h=`<h1>My recipes</h1><button onclick="editor()">＋ New recipe</button><div class="cards" style="margin-top:16px">${all().filter(r=>saved.includes(r.id)).map(card).join('')||'<p class="muted">Save a recipe to start your collection.</p>'}</div>`;
if(page==='Discover')h=`<h1>Discover</h1><input placeholder="Search drinks" oninput="search(this.value)"><div class="row" style="flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px">${['All',...new Set(all().map(r=>r.type))].map(t=>`<button class="${filter===t?'active':''}" onclick="filter='${t}';render()">${t}</button>`).join('')}</div><div class="cards" id="results" style="margin-top:16px">${all().filter(r=>filter==='All'||r.type===filter).map(card).join('')}</div>`;
if(page==='My Bar')h=`<h1>My bar</h1><div class="panel"><label>Add an ingredient<input id="ingredient" placeholder="e.g. lime juice"></label><button class="primary" onclick="addBar()">Add ingredient</button>${bar.map((x,i)=>`<p>${esc(x)} <button onclick="bar.splice(${i},1);persist();render()">Remove</button></p>`).join('')}</div><h2>What can I make?</h2>${all().map(r=>({r,n:r.ingredients.filter(x=>bar.includes(x[2].toLowerCase())).length/r.ingredients.length})).sort((a,b)=>b.n-a.n).slice(0,20).map(({r})=>`<div class="panel" onclick="detail('${r.id}')"><strong>${esc(r.name)}</strong><p>${r.ingredients.filter(x=>bar.includes(x[2].toLowerCase())).length} of ${r.ingredients.length} ingredients available</p></div>`).join('')}`;
if(page==='Detail'&&current){let r=current;h=`<button onclick="go('Discover')">‹ Back</button><img class="recipeimg" src="${esc(r.img||'hero.jpg')}"><h1>${esc(r.name)}</h1><p>${esc(r.desc)}</p><div class="panel"><div class="row"><strong>Ingredients</strong><button onclick="serves=Math.max(1,serves-1);render()">−</button><span>${serves} serving(s)</span><button onclick="serves++;render()">+</button></div>${r.ingredients.map(x=>`<label class="check"><input type="checkbox">${+(x[0]*serves).toFixed(2)} ${esc(x[1])} ${esc(x[2])}</label>`).join('')}</div><div class="panel"><strong>Instructions</strong><ol>${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div><div class="row"><button class="primary" onclick="toggleSave()">${saved.includes(r.id)?'♥ Saved — remove':'♡ Save recipe'}</button><button onclick="editor(current)">Customize</button><button onclick="shareRecipe()">Share</button></div>`}$('#app').innerHTML=h}
function detail(id){current=all().find(r=>r.id===id);serves=1;go('Detail')}function toggleSave(){saved=saved.includes(current.id)?saved.filter(x=>x!==current.id):[...saved,current.id];persist();render()}function preview(el){if(el.files[0])$('#preview').src=URL.createObjectURL(el.files[0])}function match(){let q=$('#desc').value.toLowerCase().trim();if(!q){$('#matches').textContent='Enter a drink name or ingredients.';return}let words=q.split(/[^a-z]+/).filter(x=>x.length>2);let ranked=all().map(r=>({r,n:words.filter(w=>[r.name,r.type,r.desc,...r.ingredients.map(x=>x[2])].join(' ').toLowerCase().includes(w)).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n);$('#matches').innerHTML=ranked.length?'<h2>Possible matches</h2><div class="cards">'+ranked.map(x=>card(x.r)).join('')+'</div>':'<p>No local matches. Create a custom recipe below.</p>'}function search(q){$('#results').innerHTML=all().filter(r=>(filter==='All'||r.type===filter)&&[r.name,r.type,r.desc,...r.ingredients.map(x=>x[2])].join(' ').toLowerCase().includes(q.toLowerCase())).map(card).join('')}function addBar(){let v=$('#ingredient').value.trim().toLowerCase();if(v&&!bar.includes(v)){bar.push(v);persist();render()}}function editor(r){$('#app').innerHTML=`<h1>${r?'Customize':'New recipe'}</h1><form id="edit"><label>Name<input id="rn" required value="${esc(r?.name||'')}"></label><label>Category<select id="rt">${[...new Set([...all().map(x=>x.type),r?.type].filter(Boolean))].map(t=>`<option ${r?.type===t?'selected':''}>${t}</option>`).join('')}</select></label><label>Description<input id="rd" value="${esc(r?.desc||'')}"></label><label>Ingredients (one per line: amount, unit, name)<textarea id="ri" required>${esc(r?.ingredients.map(x=>x.join(', ')).join('\n')||'')}</textarea></label><label>Steps (one per line)<textarea id="rs" required>${esc(r?.steps.join('\n')||'')}</textarea></label><button class="primary">Save custom recipe</button></form>`;$('#edit').onsubmit=e=>{e.preventDefault();let ingredients=$('#ri').value.trim().split('\n').map(s=>s.split(',').map(x=>x.trim())).map(x=>[Number(x[0]),x[1],x.slice(2).join(', ')]);if(ingredients.some(x=>!Number.isFinite(x[0])||x[0]<0||!x[2])){alert('Use amount, unit, ingredient on each line.');return}let n={id:'r'+Date.now(),name:$('#rn').value,type:$('#rt').value,desc:$('#rd').value,img:r?.img||'hero.jpg',ingredients,steps:$('#rs').value.trim().split('\n')};custom.push(n);saved.push(n.id);persist();detail(n.id)}}async function shareRecipe(){let text=current.name+'\n'+current.ingredients.map(x=>x.join(' ')).join('\n')+'\n'+current.steps.join('\n');try{if(navigator.share)await navigator.share({title:current.name,text});else{await navigator.clipboard.writeText(text);alert('Recipe copied')}}catch(e){}}let deferred;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});$('#install').onclick=async()=>{if(deferred){await deferred.prompt();deferred=null}else alert('Use your browser menu → Install app or Add to Home Screen. Installation requires HTTPS.')} ;if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{});let rl=!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!rl){rl=true;location.reload()}})}render();</script><script src="lixr-ai.js"></script><script src="lixr-price.js"></script></body></html>
